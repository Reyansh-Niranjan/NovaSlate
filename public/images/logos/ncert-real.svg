<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 32" fill="none" height="32">
  <!-- Official NCERT 3-Hamsa Triquetra Emblem -->
  <g transform="translate(3, 2)">
    <circle cx="14" cy="14" r="13" stroke="#2b2b2b" stroke-width="1.2" fill="none"/>
    <!-- Top Swan / Loop -->
    <path d="M14 4.5 C16.5 4.5, 18.5 7, 17.5 9.8 C16.5 12, 14 14, 14 14 C14 14, 11.5 12, 10.5 9.8 C9.5 7, 11.5 4.5, 14 4.5 Z" fill="#2b2b2b"/>
    <!-- Bottom Left Swan / Loop -->
    <path d="M6 19 C5 16.5, 6.5 14, 9.5 14 C12 14, 14 14, 14 14 C14 14, 12 16.5, 10.5 18.5 C9 20.5, 7 21, 6 19 Z" fill="#2b2b2b"/>
    <!-- Bottom Right Swan / Loop -->
    <path d="M22 19 C23 16.5, 21.5 14, 18.5 14 C16 14, 14 14, 14 14 C14 14, 16 16.5, 17.5 18.5 C19 20.5, 21 21, 22 19 Z" fill="#2b2b2b"/>
