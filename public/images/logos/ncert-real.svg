    <circle cx="14" cy="14" r="1.5" fill="#f1f1f1"/>
  </g>
  <text x="36" y="20" fill="#2b2b2b" font-family="'Supply Mono', 'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="-0.02em">NCERT &amp; CBSE</text>
</svg>
